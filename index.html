<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Evento</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; margin: 0; }
    .card { background: white; max-width: 420px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1a1a1a; }
    .badge { display: inline-block; padding: 6px 14px; background: #e9ecef; border-radius: 20px; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    #status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; background: #e2e3e5; color: #383d41; }
    .success { background: #d4edda !important; color: #155724 !important; }
    .duplicate { background: #fff3cd !important; color: #856404 !important; }
    .error { background: #f8d7da !important; color: #721c24 !important; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Registro de Sellos</h2>
    <div class="badge">Stand: <span id="stand-name">General</span></div>
    <div id="reader"></div>
    <div id="status">Iniciando cámara...</div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE APPS SCRIPT TERMINADA EN /exec
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaaNqJqYKEFQy5KgbTUbVVQOi6kX8dYZnU-M2Dzz5x1WWaYvGTqXiIX0246YDYb_Vp/exec";

    const params = new URLSearchParams(window.location.search);
    const standId = params.get('stand') || 'General';
    document.getElementById('stand-name').innerText = standId;

    let isScanning = true;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;

      const statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.innerText = 'Registrando entrada...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ standId: standId, ticketId: decodedText })
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = '¡Ticket registrado con éxito!';
        setTimeout(() => {
          statusDiv.className = '';
          statusDiv.innerText = 'Listo para el siguiente';
          isScanning = true;
        }, 2000);
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error al registrar';
        setTimeout(() => { isScanning = true; }, 2000);
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).then(() => {
      document.getElementById('status').innerText = 'Apunta al código QR del asistente';
    }).catch(err => {
      document.getElementById('status').className = 'error';
      document.getElementById('status').innerText = 'Permiso de cámara denegado. Concede el permiso en el navegador.';
    });
  </script>
</body>
</html>
