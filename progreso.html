<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Progreso - Pasaporte de Stands</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; }
    
    .input-group {
      margin: 20px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      text-align: center;
      margin-bottom: 10px;
    }
    input[type="text"]:focus {
      border-color: #007bff;
      outline: none;
    }
    .btn-submit {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-submit:hover {
      background: #0056b3;
    }

    .ticket-badge {
      display: inline-block;
      background: #e9ecef;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #495057;
      margin-bottom: 15px;
    }
    .progress-container {
      background: #e9ecef;
      border-radius: 10px;
      height: 22px;
      overflow: hidden;
      margin: 20px 0 10px 0;
    }
    .progress-bar {
      background: #28a745;
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-in-out;
    }
    .counter {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }
    .stand-list {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      text-align: left;
      max-height: 220px;
      overflow-y: auto;
    }
    .stand-item {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .check { color: #28a745; font-weight: bold; }
    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 15px;
    }
    .alert-success { background: #d4edda; color: #155724; font-weight: bold; }
    .alert-error { background: #f8d7da; color: #721c24; }
    .btn-reload {
      margin-top: 20px;
      background: #6c757d;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tu Pasaporte de Stands</h2>
    
    <!-- Formulario para ingresar el número de ticket de forma manual -->
    <div id="form-container">
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
        Ingresa el número de tu entrada para ver tus sellos acumulados:
      </p>
      <div class="input-group">
        <input type="text" id="manual-ticket-input" placeholder="Ej: 1234567890">
        <button class="btn-submit" onclick="consultarManual()">Ver mi progreso</button>
      </div>
    </div>

    <!-- Área de resultados donde se renderiza la información -->
    <div id="resultado-container" style="display: none;">
      <div class="ticket-badge">Entrada N°: <span id="ticket-id">-</span></div>
      <div id="content"></div>
    </div>
  </div>

  <script>
    // URL de tu Apps Script terminada en /exec
    const SCRIPT_URL = "AQUI_TU_URL_DE_APPS_SCRIPT"; 
    const TOTAL_STANDS = 20; // Ajusta al total de stands de tu evento

    // Capturar parámetro ?ticket= de la URL
    const urlParams = new URLSearchParams(window.location.search);
    let ticketIdParam = urlParams.get('ticket');

    // Si viene en la URL, ocultar el campo de texto y consultar de inmediato
    if (ticketIdParam) {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('resultado-container').style.display = 'block';
      document.getElementById('ticket-id').innerText = ticketIdParam;
      cargarProgreso(ticketIdParam);
    }

    function consultarManual() {
      const input = document.getElementById('manual-ticket-input').value.trim();
      if (!input) {
        alert("Por favor ingresa un número de ticket válido.");
        return;
      }
      
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('resultado-container').style.display = 'block';
      document.getElementById('ticket-id').innerText = input;
      cargarProgreso(input);
    }

    function cargarProgreso(id) {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '<p style="color: #666; font-size: 14px;">Consultando tus sellos acumulados...</p>';

      fetch(`${SCRIPT_URL}?ticket=${encodeURIComponent(id)}`)
        .then(res => res.json())
        .then(data => {
          if (data.status !== 'success') {
            contentDiv.innerHTML = `<div class="alert alert-error">${data.message || 'Error al obtener la información'}</div>`;
            return;
          }

          const visitados = data.totalVisitados;
          const porcentaje = Math.min(100, Math.round((visitados / TOTAL_STANDS) * 100));

          let html = `
            <div class="counter">${visitados} de ${TOTAL_STANDS} sellos (${porcentaje}%)</div>
            <div class="progress-container">
              <div class="progress-bar" style="width: ${porcentaje}%;"></div>
            </div>
          `;

          if (visitados >= TOTAL_STANDS) {
            html += `
              <div class="alert alert-success">
                🎉 ¡Felicitaciones! Has completado el recorrido y estás participando en el sorteo.
              </div>
            `;
          }

          if (data.stands.length > 0) {
            html += '<h4 style="text-align: left; margin: 20px 0 5px 0; color: #555;">Stands visitados:</h4>';
            html += '<ul class="stand-list">';
            data.stands.forEach(stand => {
              html += `<li class="stand-item"><span>${stand}</span><span class="check">✔ Sellado</span></li>`;
            });
            html += '</ul>';
          } else {
            html += '<p style="color: #888; font-size: 14px; margin-top: 20px;">Aún no tienes sellos registrados. ¡Visita los stands para comenzar!</p>';
          }

          html += `
            <button class="btn-submit" style="margin-top: 20px;" onclick="cargarProgreso('${id}')">🔄 Actualizar sellos</button>
            <button class="btn-reload" onclick="cambiarTicket()">🔍 Buscar otro ticket</button>
          `;

          contentDiv.innerHTML = html;
        })
        .catch(err => {
          contentDiv.innerHTML = `
            <div class="alert alert-error">Error de conexión al cargar tus datos. Intenta nuevamente.</div>
            <button class="btn-reload" onclick="cargarProgreso('${id}')">Reintentar</button>
          `;
        });
    }

    function cambiarTicket() {
      document.getElementById('resultado-container').style.display = 'none';
      document.getElementById('form-container').style.display = 'block';
      document.getElementById('manual-ticket-input').value = '';
    }
  </script>
</body>
</html>
